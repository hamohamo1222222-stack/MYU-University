<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <script>
    if (sessionStorage.getItem("loggedIn") !== "true") {
        window.location.href = "login.html";
    }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بوابة الخدمات الطلابية - جامعة مايو</title>

    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet"

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    ========================== -->

    <header class="topbar">

        <div class="top-left">

            <img
                src="images/profile.jpg"

            <button

            <a href="#" class="english-link">En</a>

        <a href="pages/results.html" class="service-card">
