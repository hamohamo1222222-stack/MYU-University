
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MYU - بوابة الخدمات الطلابية</title>

    <link rel="stylesheet" href="login.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main class="login-page">

        <!-- Login Card -->
        <section class="login-card">

            <!-- University Logo -->
            <div class="logo-container">
                <img src="images/MYU.PNG"
                     alt="MYU University Logo"
                     class="university-logo">
            </div>

            <!-- Page Title -->
            <div class="login-heading">
                <h1 data-i18n="portalTitle">بوابة الخدمات الطلابية</h1>
                <p data-i18n="systemName">نظام ابن الهيثم - جامعة مايو</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Username -->
                <div class="input-group">

                    <span class="input-icon">
                        <i class="fa-solid fa-user"></i>
                    </span>

                    <input
                        type="text"
                        id="username"
                        placeholder="اسم المستخدم"
                        data-placeholder="username"
                        autocomplete="username"
                        required
                    >

                </div>

                <!-- Password -->
                <div class="input-group">

                    <span class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="كلمة المرور"
                        data-placeholder="password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <!-- Remember Me -->
                <div class="remember-row">

                    <label class="remember-label" for="rememberMe">
                        <span data-i18n="remember">تذكرني</span>

                        <input type="checkbox" id="rememberMe">
                        <span class="custom-checkbox"></span>
                    </label>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-button">

                    <i class="fa-solid fa-key"></i>

                    <span data-i18n="login">تسجيل الدخول</span>

                </button>

                <!-- Login Message -->
                <div id="loginMessage" class="login-message"></div>

            </form>

            <!-- Forgot Password -->
            <div class="forgot-password">
                <a href="#" id="forgotPassword"
                   data-i18n="forgotPassword">
                    نسيت كلمة المرور
                </a>
            </div>

            <!-- Language Switch -->
            <div class="language-switch">
                <button type="button" id="languageToggle">
                    English
                </button>
            </div>

        </section>

        
    </main>

    <!-- Footer -->
    

    <footer class="page-footer">

        <a href="#" data-i18n="privacy">
            <i class="fa-solid fa-shield-halved"></i>
            سياسة الخصوصية
        </a>

        <a >
            
           جميع الحقوق محفوظة © مركز إنتاج نظم تكنولوجيا المعلومات والاتصالات
        </a>

        

    </footer>

    <script src="app.js"></script>

</body>
</html>
