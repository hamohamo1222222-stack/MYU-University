
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MYU - Student Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= TOP HEADER ================= -->

    <header class="top-header">

        <!-- Left Side -->
        <div class="header-left">

            <img src="images/profile.jpg"
                 alt="Student Profile"
                 class="profile-image"
                 id="profileImage">

            <button class="header-icon logout-btn"
                    id="logoutButton"
                    title="تسجيل الخروج">
                <i class="fa-solid fa-power-off"></i>
            </button>

            <button class="header-icon"
                    id="passwordBtn"
                    title="كلمة المرور">
                <i class="fa-solid fa-key"></i>
            </button>

            <button class="header-icon"
                    id="settingsBtn"
                    title="الإعدادات">
                <i class="fa-solid fa-gears"></i>
            </button>

            <button class="language-button" id="languageToggle">
                En
            </button>

        </div>

        <!-- Center Date -->
        <div class="header-date" id="currentDate">
            <!-- Date generated by JavaScript -->
        </div>

        <!-- ✅ الشكل المطور ليدعم الانتقال للداشبورد -->
        <div class="header-right">
            <a href="dashboard.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; text-decoration: none;">
                <img src="images/MYU.PNG" alt="Logo" class="header-logo">
            </a>
        </div>

    </header>


    <!-- ================= SERVICES SECTION ================= -->

    <main class="dashboard-container">

        <nav class="services-navigation">

            <!-- First Row: 9 Services -->
            <div class="services-row services-row-first">

                <a href="personal-data.html" class="service-card"
                    data-service="personalData">

                    <i class="fa-regular fa-address-card"></i>
                    <span data-i18n="personalData">البيانات الشخصية</span>

                </a>

                <a href="results.html" class="service-card"
                   data-service="academicResults">

                    <i class="fa-solid fa-list"></i>
                    <span data-i18n="academicResults">النتائج الدراسية</span>

                </a>

                <a href="registration.html" class="service-card"
                   data-service="academicRegistration">

                    <i class="fa-solid fa-file-pen"></i>
                    <span data-i18n="academicRegistration">التسجيل الأكاديمي</span>

                </a>

                <a href="military.html" class="service-card"
                   data-service="militaryEducation">

                    <i class="fa-solid fa-user-shield"></i>
                    <span data-i18n="militaryEducation">التربية العسكرية</span>

                </a>

                <a href="student-cards.html" class="service-card"
                   data-service="studentCards">

                    <i class="fa-solid fa-id-card"></i>
                    <span data-i18n="studentCards">البطاقات التعريفية</span>

                </a>

                <a href="estb.html" class="service-card"
                   data-service="survey">

                    <i class="fa-regular fa-circle-question"></i>
                    <span data-i18n="survey">استبيان</span>

                </a>

                <a href="inbox.html" class="service-card"
                   data-service="inbox">

                    <i class="fa-regular fa-envelope"></i>
                    <span data-i18n="inbox">صندوق البريد</span>

                </a>

                <a href="registration-form.html" class="service-card"
                   data-service="registrationForm">

                    <i class="fa-regular fa-newspaper"></i>
                    <span data-i18n="registrationForm">استمارة التسجيل</span>

                </a>

                <a href="grievances.html" class="service-card"
                   data-service="complaints">

                    <i class="fa-solid fa-scale-balanced"></i>
                    <span data-i18n="complaints">تظلمات</span>

                </a>

            </div>


            <!-- Second Row: 5 Services -->
            <div class="services-row services-row-second">

                <a href="withdrawal.html" class="service-card"
                   data-service="withdrawal">

                    <i class="fa-regular fa-file-excel"></i>
                    <span data-i18n="withdrawal">الانسحاب من مقرر</span>

                </a>

                <!-- الرسوم -->
            <a href="#" class="service-card modal-trigger-card" data-modal-group="fees">
                <i class="fa-solid fa-money-bill-wave"></i>
                <span data-i18n="fees">الرسوم</span>
            </a>

            <a href="#" class="service-card modal-trigger-card" data-modal-group="courses">
                <i class="fa-solid fa-book"></i>
                <span data-i18n="courses">مقرراتي</span>
            </a>

            <a href="#" class="service-card modal-trigger-card" data-modal-group="attendance">
                <i class="fa-solid fa-calendar-check"></i>
                <span data-i18n="attendance">الحضور والغياب</span>
            </a>

            <a href="#" class="service-card modal-trigger-card" data-modal-group="schedule">
                <i class="fa-solid fa-table"></i>
                <span data-i18n="schedule">الجداول</span>
            </a>
        </div>
    </main>

    <!-- Dashboard Submenu Modal -->
    <div id="dashboardSubModal" class="dash-modal-overlay" aria-hidden="true">
        <div class="dash-modal-box">
            <div class="dash-modal-header" id="dashModalTitle">مقرراتي</div>
            <div class="dash-modal-body" id="dashModalItems"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="dashboard-footer">
        <a href="privacy.html"><i class="fa-solid fa-lock"></i> <span data-i18n="privacy">سياسة الخصوصية</span></a>
        <a href="terms.html"><i class="fa-solid fa-file-contract"></i> <span data-i18n="terms">الشروط والأحكام</span></a>
        <a href="support.html"><i class="fa-solid fa-headset"></i> <span data-i18n="help">طلب دعم</span></a>
    </footer>

    <script src="js/app.js"></script>

    <script>
document.addEventListener("DOMContentLoaded", function () {
    const menus = {
        fees: {
            titleAr: "الرسوم", titleEn: "Fees",
            items: [
                { labelAr: "بيانات سداد الرسوم", labelEn: "Fees Payment Details", icon: "fa-solid fa-money-bill-1-wave", href: "fees.html" },
                { labelAr: "إذن الدفع", labelEn: "Payment Permission", icon: "fa-solid fa-money-bill-transfer", href: "payment-permission.html" }
            ]
        },
        courses: {
            titleAr: "مقرراتي", titleEn: "My Courses",
            items: [
                { labelAr: "المنصة الإلكترونية", labelEn: "Electronic Platform", icon: "fa-solid fa-book-open-reader", href: "electronic-platform.html" },
                { labelAr: "تحديث المنصة", labelEn: "Update Platform", icon: "fa-solid fa-arrows-rotate", href: "update-platform.html" }
            ]
        },
        attendance: {
            titleAr: "الحضور والغياب", titleEn: "Attendance",
            items: [
                { labelAr: "الغياب", labelEn: "Absence", icon: "fa-solid fa-clipboard-user", href: "absence.html" },
                { labelAr: "حضور QR code", labelEn: "QR Code Attendance", icon: "fa-solid fa-qrcode", href: "qr-attendance.html" }
            ]
        },
        schedule: {
            titleAr: "الجداول", titleEn: "Schedules",
            items: [
                { labelAr: "الجدول الدراسي", labelEn: "Study Schedule", icon: "fa-solid fa-calendar-days", href: "study-schedule.html" },
                { labelAr: "جدول الامتحانات", labelEn: "Exam Schedule", icon: "fa-solid fa-file-pen", href: "exam-schedule.html" }
            ]
        }
    };

    const overlay = document.getElementById("dashboardSubModal");
    const titleEl = document.getElementById("dashModalTitle");
    const itemsEl = document.getElementById("dashModalItems");

    document.querySelectorAll(".modal-trigger-card").forEach(card => {
        card.onclick = function (e) {
            e.preventDefault();
            const data = menus[this.getAttribute("data-modal-group")];
            if (!data || !overlay) return;

            const isAr = document.documentElement.lang !== "en";
            titleEl.textContent = isAr ? data.titleAr : data.titleEn;
            itemsEl.innerHTML = data.items.map(item => `
                <a href="${item.href}" class="dash-modal-item">
                    <i class="${item.icon}"></i>
                    <span>${isAr ? item.labelAr : item.labelEn}</span>
                </a>
            `).join("");

            overlay.style.display = "flex";
            overlay.classList.add("open");
        };
    });

    if (overlay) {
        overlay.onclick = function (e) {
            if (e.target === overlay) {
                overlay.style.display = "none";
                overlay.classList.remove("open");
            }
        };
    }
});
</script>



</body>
</html>
