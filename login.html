<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بوابة الخدمات الطلابية - جامعة مايو</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- طبقة الخلفية -->
    <div class="background"></div>

    <!-- صندوق تسجيل الدخول -->
    <div class="login-container">

        <!-- الشعار -->
        <div class="logo-container">
            <img src="images/MYU.PNG" alt="MYU Logo">
        </div>

        <!-- العنوان -->
        <h1>بوابة الخدمات الطلابية</h1>

        <p class="subtitle">
            نظام ابن الهيثم - جامعة مايو
        </p>

        <!-- نموذج الدخول -->
        <form id="loginForm">

            <!-- اسم المستخدم -->
            <div class="input-group">
                <span class="icon">👤</span>

                <input
                    type="text"
                    id="username"
                    placeholder="اسم المستخدم"
                    autocomplete="username"
                >
            </div>

            <!-- كلمة المرور -->
            <div class="input-group">
                <span class="icon">🔒</span>

                <input
                    type="password"
                    id="password"
                    placeholder="كلمة المرور"
                    autocomplete="current-password"
                >
            </div>

            <!-- تذكرني -->
            <div class="remember-row">

                <label>
                    <input type="checkbox" id="remember">
                    تذكرني
                </label>

                <span class="close-x">×</span>

            </div>

            <!-- زر الدخول -->
            <button type="submit" class="login-button">
                🔑
            </button>

            <!-- نسيت كلمة المرور -->
            <a href="#" class="forgot-password">
                نسيت كلمة المرور
            </a>

        </form>

        <!-- English -->
        <a href="#" class="english">
            English
        </a>

    </div>

    <!-- النص أسفل الصندوق -->
    <div class="system-info">
        جميع الحقوق محفوظة © مركز إدارة نظم المعلومات والبرامج
        <br>
        2020
    </div>

    <!-- الشريط السفلي -->
    <footer>
        <span>⚙</span>
        سياسة الخصوصية وتأمين البيانات
    </footer>

    <script src="js/login.js"></script>

</body>
</html>
